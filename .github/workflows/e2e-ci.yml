name: E2E CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e-ci.yml'
  push:
    branches:
      - main
      - feature/e2e-qa

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Aa1!AuditCore${{ github.run_id }}
        ports:
          - 1433:1433

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5047
      ConnectionStrings__DefaultConnection: Server=127.0.0.1,1433;Database=AuditCoreE2E;User Id=sa;Password=Aa1!AuditCore${{ github.run_id }};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True
      SeedData__AdminEmail: admin@auditcore.local
      SeedData__AdminPassword: E2E!Admin${{ github.run_id }}Aa1
      Jwt__Issuer: AuditCore
      Jwt__Audience: AuditCore.Web
      Jwt__Key: AuditCore-E2E-${{ github.run_id }}-Ephemeral-Key-For-CI-Only-32Chars
      Jwt__AccessTokenMinutes: 15
      Jwt__RefreshTokenDays: 7
      Cors__AllowedOrigins__0: http://127.0.0.1:4173
      RateLimiting__AuthPermitLimit: 100
      VITE_API_URL: http://127.0.0.1:5047/api
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_ADMIN_EMAIL: admin@auditcore.local
      E2E_ADMIN_PASSWORD: E2E!Admin${{ github.run_id }}Aa1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore backend
        working-directory: backend
        run: dotnet restore ./AuditCore.slnx

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Wait for SQL Server
        shell: bash
        run: |
          for i in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' 2>/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'SQL Server did not become available in time.'
          exit 1

      - name: Apply database migrations
        working-directory: backend
        run: dotnet ef database update --project ./src/AuditCore.Infrastructure/AuditCore.Infrastructure.csproj --startup-project ./src/AuditCore.Api/AuditCore.Api.csproj --context AuditCoreDbContext

      - name: Start API
        working-directory: backend
        run: nohup dotnet run --project ./src/AuditCore.Api/AuditCore.Api.csproj --no-launch-profile > /tmp/auditcore-api.log 2>&1 &

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5047/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/auditcore-api.log || true
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend/auditcore-web
        run: npm ci

      - name: Build frontend
        working-directory: frontend/auditcore-web
        run: npm run build

      - name: Start frontend preview
        working-directory: frontend/auditcore-web
        run: nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/auditcore-web.log 2>&1 &

      - name: Wait for frontend
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/auditcore-web.log || true
          exit 1

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
