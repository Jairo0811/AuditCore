name: Refresh frontend lockfile

on:
  push:
    branches:
      - release/v1-hardening
    paths:
      - 'frontend/auditcore-web/package.json'
      - '.github/workflows/refresh-frontend-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/v1-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh lockfile
        working-directory: frontend/auditcore-web
        run: npm install --package-lock-only

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- frontend/auditcore-web/package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/auditcore-web/package-lock.json
          git commit -m 'fix(security): refresh frontend lockfile'
          git push origin HEAD:release/v1-hardening
