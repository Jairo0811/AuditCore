name: Apply continuity documentation

on:
  push:
    branches:
      - 'docs/eventix-style-continuity'
    paths:
      - '.github/workflows/continuity-apply.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/eventix-style-continuity
      - name: Patch README
        run: python .github/scripts/patch-continuity.py
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: align academic continuity with Eventix style"
          git push origin HEAD:docs/eventix-style-continuity
